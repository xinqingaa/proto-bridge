      <text x="1295" y="304" text-anchor="middle" class="label">reconstruct</text><text x="1295" y="330" text-anchor="middle" class="label">PageContext</text>
    </g>
  
      <line x1="1295" y1="348" x2="1295" y2="455" stroke="#36d1dc" stroke-width="3" stroke-opacity="0.78" marker-end="url(#arrow)"/>
      
    <g filter="url(#softShadow)">
      <rect x="145" y="455" width="1310" height="260" rx="26" fill="rgba(16,27,46,0.82)" stroke="#2b4164"/>
      <text x="179" y="503" class="label">共享 Capabilities</text>
      
    <rect x="205" y="540" width="215" height="54" rx="14" fill="#0c1728" stroke="#4f8cff" stroke-opacity="0.72"/>
    <text x="312.5" y="574" text-anchor="middle" class="mono">source.analyze</text>
  
    <rect x="465" y="540" width="215" height="54" rx="14" fill="#0c1728" stroke="#36d1dc" stroke-opacity="0.72"/>
    <text x="572.5" y="574" text-anchor="middle" class="mono">runtime.capture</text>
  
    <rect x="725" y="540" width="215" height="54" rx="14" fill="#0c1728" stroke="#62d394" stroke-opacity="0.72"/>
    <text x="832.5" y="574" text-anchor="middle" class="mono">screenshot.attach</text>
  
    <rect x="985" y="540" width="215" height="54" rx="14" fill="#0c1728" stroke="#f4b860" stroke-opacity="0.72"/>
    <text x="1092.5" y="574" text-anchor="middle" class="mono">target.inspect</text>
  
    <rect x="285" y="642" width="215" height="54" rx="14" fill="#0c1728" stroke="#4f8cff" stroke-opacity="0.72"/>
    <text x="392.5" y="676" text-anchor="middle" class="mono">page.merge</text>
  
    <rect x="545" y="642" width="215" height="54" rx="14" fill="#0c1728" stroke="#36d1dc" stroke-opacity="0.72"/>
    <text x="652.5" y="676" text-anchor="middle" class="mono">ui.plan</text>
  
    <rect x="805" y="642" width="215" height="54" rx="14" fill="#0c1728" stroke="#62d394" stroke-opacity="0.72"/>
    <text x="912.5" y="676" text-anchor="middle" class="mono">ui.review</text>
  
    <rect x="1065" y="642" width="215" height="54" rx="14" fill="#0c1728" stroke="#f07178" stroke-opacity="0.72"/>
    <text x="1172.5" y="676" text-anchor="middle" class="mono">ui.validate</text>
  
    </g>
  
      <line x1="800" y1="716" x2="800" y2="790" stroke="#36d1dc" stroke-width="3" stroke-opacity="0.78" marker-end="url(#arrow)"/>
      
    <g filter="url(#softShadow)">
      <rect x="505" y="790" width="590" height="78" rx="30" fill="#0c1728" stroke="#36d1dc" stroke-opacity="0.8"/>
      <text x="800" y="824" text-anchor="middle" class="label">统一页面上下文</text><text x="800" y="850" text-anchor="middle" class="label">实现产物与验证结果</text>
