      <text x="824" y="332" class="body">嵌入式调用入口</text>
    </g>
  
      <line x1="410" y1="309" x2="465" y2="309" stroke="#36d1dc" stroke-width="3" stroke-opacity="0.78" marker-end="url(#arrow)"/>
      <line x1="735" y1="309" x2="790" y2="309" stroke="#36d1dc" stroke-width="3" stroke-opacity="0.78" marker-end="url(#arrow)"/>
      <line x1="1060" y1="309" x2="1135" y2="309" stroke="#36d1dc" stroke-width="3" stroke-opacity="0.78" marker-end="url(#arrow)"/>
      
    <g filter="url(#softShadow)">
