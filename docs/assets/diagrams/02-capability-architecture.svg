<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960">
  <style>
    .title { font: 700 48px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; letter-spacing: 0; }
    .subtitle { font: 400 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8fa3bd; letter-spacing: 0; }
    .label { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #edf5ff; letter-spacing: 0; }
    .body { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8fa3bd; letter-spacing: 0; }
    .small { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #8fa3bd; letter-spacing: 0; }
    .mono { font: 600 17px "SFMono-Regular", Consolas, monospace; fill: #edf5ff; letter-spacing: 0; }
  </style>
  
    <defs>
      <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#10294a"/>
        <stop offset="58%" stop-color="#08111f"/>
        <stop offset="100%" stop-color="#07101c"/>
      </linearGradient>
      <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#4f8cff"/>
        <stop offset="100%" stop-color="#36d1dc"/>
      </linearGradient>
      <filter id="softShadow" x="-18%" y="-18%" width="136%" height="148%">
        <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.24"/>
      </filter>
      <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
        <path d="M2,2 L10,6 L2,10 Z" fill="#36d1dc"/>
      </marker>
    </defs>
    <rect width="1600" height="960" fill="url(#bgGlow)"/>
    <rect x="64" y="56" width="1472" height="848" rx="34" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.08)"/>
    <text x="100" y="126" class="title">Capability-first 架构</text>
    <text x="102" y="166" class="subtitle">CLI、MCP 和 Core API 只是入口，底层能力沉淀在共享 capabilities</text>
    <rect x="100" y="194" width="260" height="5" rx="3" fill="url(#accent)"/>
    
      
    <g filter="url(#softShadow)">
      <rect x="150" y="250" width="260" height="118" rx="18" fill="#101b2e" stroke="#2b4164"/>
      <rect x="150" y="250" width="260" height="5" rx="3" fill="#4f8cff"/>
      <text x="280" y="297" text-anchor="middle" class="label">CLI</text>
      <text x="174" y="332" class="body">终端入口 / 批处理</text>
    </g>
  
      
    <g filter="url(#softShadow)">
      <rect x="475" y="250" width="260" height="118" rx="18" fill="#101b2e" stroke="#2b4164"/>
      <rect x="475" y="250" width="260" height="5" rx="3" fill="#36d1dc"/>
      <text x="605" y="297" text-anchor="middle" class="label">MCP</text>
      <text x="499" y="332" class="body">agent / tool</text><text x="499" y="354" class="body"> 调用入口</text>
    </g>
  
      
    <g filter="url(#softShadow)">
      <rect x="800" y="250" width="260" height="118" rx="18" fill="#101b2e" stroke="#2b4164"/>
      <rect x="800" y="250" width="260" height="5" rx="3" fill="#62d394"/>
